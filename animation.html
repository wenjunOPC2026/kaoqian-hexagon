<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动画测试 - 出发的理由</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "PingFang SC","Noto Sans SC",sans-serif; background: #f0ebe0; display: flex; justify-content: center; align-items: center; }

  .card-outer { width: 92vw; max-width: 520px; position: relative;
    border: 4px solid rgba(139,106,74,0.7); border-radius: 16px; padding: 8px; }
  .card-outer::after { content:''; position:absolute; inset:8px; border:2px solid rgba(160,144,128,0.5); border-radius:10px; pointer-events:none; }

  .corner { position:absolute; width:24px; height:24px; border-color:rgba(139,106,74,0.5); border-style:solid; z-index:2; }
  .corner.tl { top:5px; left:5px; border-width:2px 0 0 2px; border-radius:3px 0 0 0; }
  .corner.tr { top:5px; right:5px; border-width:2px 2px 0 0; border-radius:0 3px 0 0; }
  .corner.bl { bottom:5px; left:5px; border-width:0 0 2px 2px; border-radius:0 0 0 3px; }
  .corner.br { bottom:5px; right:5px; border-width:0 2px 2px 0; border-radius:0 0 3px 0; }

  .card { background: linear-gradient(180deg, #fdfaf5 0%, #faf5ed 50%, #f5ede0 100%); border-radius: 10px; padding: 4vw 5vw; }
  .accent-bar { height: 3px; background: #3a2a1a; border-radius: 1.5px; margin-bottom: 5vw; }
  .title { text-align: center; font-size: clamp(1.2em, 5vw, 1.8em); font-weight: 300; color: #2c1a0a; margin-bottom: 5vw; }

  .item { display: flex; align-items: flex-start; gap: 2.5vw; margin-bottom: 4vw; opacity: 0; transform: translateY(12px); }
  .item.show { animation: fadeIn 0.45s ease-out forwards; }
  .item .dot { flex-shrink: 0; width: 6vw; height: 6vw; max-width: 28px; max-height: 28px; border-radius: 50%; margin-top: 1vw; display:flex; align-items:center; justify-content:center; }
  .item .num { width: 3.5vw; height: 3.5vw; max-width: 16px; max-height: 16px; border-radius: 50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size: clamp(7px, 2vw, 10px); font-weight:700; }
  .item .label { font-size: clamp(0.5em, 1.8vw, 0.65em); color: #b0a090; letter-spacing: 1px; margin-bottom: 0.5vw; }
  .item .text { font-weight: 300; font-size: clamp(0.85em, 3.2vw, 1.15em); color: #2c2416; line-height: 1.5; display: block; }

  .divider { height: 1px; background: #d8c8b0; margin: 5vw 0; opacity: 0; }
  .divider.show { animation: fadeIn 0.5s 0.15s ease-out forwards; }
  .center-line { text-align: center; font-size: clamp(1em, 3.5vw, 1.35em); font-weight: 300; color: #2c1a0a; line-height: 1.8; opacity: 0; transform: translateY(12px); }
  .center-line.show { animation: fadeIn 0.5s 0.3s ease-out forwards; }
  .brand { text-align: center; color: #b0a090; font-size: clamp(0.55em, 1.8vw, 0.75em); font-weight: 300; margin-top: 4vw; padding-bottom: 1vw; }

  .loading { text-align: center; padding: 10vw 0; }
  .loading-msg { font-size: clamp(0.85em, 3vw, 1.05em); color: #8b6a4a; font-weight: 300; animation: pulse 2s infinite; }
  .dot-row { margin-top: 2vw; }
  .dot-row span { display: inline-block; margin: 0 1vw; font-size: clamp(1em, 4vw, 1.5em); color: #c4a882; opacity: .2; }
  .dot-row span.on { opacity: 1; transition: opacity 0.3s; }

  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:.6;} 50%{opacity:1;} }

  .btn { display: block; margin: 3vw auto 0; padding: 2.5vw 8vw; border: none; border-radius: 30px; background: #3a2a1a; color: #f5f0eb; font-size: clamp(0.85em, 3vw, 1.15em); font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div>

  <div class="card-outer" id="card-outer">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="card" id="card">
      <div class="accent-bar"></div>
      <div class="title" id="title">文君 出发的理由</div>
      <div class="loading" id="loading">
        <div class="loading-msg">AI 正在读你的答案</div>
        <div class="dot-row" id="dots"><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span></div>
      </div>
      <div id="content"></div>
    </div>
  </div>

  <button class="btn" onclick="run()">重新播放</button>

</div>

<script>
const data = {
  analysis: [
    "你真正想要的，是给自己发一张通行证。",
    "你怕被证明——当妈的确实不能两全。",
    "你在守住的，是给自己重新定义的权利。",
    "让你心跳的，是终于可以做回初学者。",
    "你获得的，是女儿心里种下了一颗种子。",
    "在这段关系里，你是她相信自己的证据。",
  ],
  center: "你想让女儿看到，妈妈也可以为自己活一次。",
  labels: ["深层动机","风险预警","内心防线","未来画面","意义锚点","共赢网络"],
  colors: ['#c0392b','#e67e22','#8e44ad','#2980b9','#27ae60','#16a085'],
  haloColors: ['#f8d2cf','#fce1c8','#e6cdee','#d2e6f8','#d0f0e1','#c8ebe4']
};

function run() {
  const content = document.getElementById('content');
  const loading = document.getElementById('loading');
  content.innerHTML = '';
  loading.style.display = 'block';

  const dotSpans = document.querySelectorAll('#dots span');
  let dotIdx = 0;
  dotSpans.forEach(s => s.className = '');
  const dotTimer = setInterval(() => {
    dotSpans.forEach((s, i) => s.className = (i <= dotIdx % 5) ? 'on' : '');
    dotIdx++;
  }, 300);

  setTimeout(() => {
    clearInterval(dotTimer);
    loading.style.display = 'none';

    let html = '';
    data.analysis.forEach((t, i) => {
      html +=
        '<div class="item" id="item' + i + '">' +
        '<span class="dot" style="background:' + data.haloColors[i] + '"><span class="num" style="background:' + data.colors[i] + '">' + (i+1) + '</span></span>' +
        '<div><span class="label">' + data.labels[i] + '</span>' +
        '<span class="text">' + t + '</span></div></div>';
    });
    html += '<div class="divider" id="divider"></div>';
    html += '<div class="center-line" id="center-line">' + data.center + '</div>';
    html += '<div class="brand">学姐爱丽丝 | 35岁脱产跨考 | 陪你做对的选择</div>';
    content.innerHTML = html;

    for (let i = 0; i < data.analysis.length; i++) {
      setTimeout(() => document.getElementById('item' + i).classList.add('show'), i * 1000);
    }
    setTimeout(() => document.getElementById('divider').classList.add('show'), data.analysis.length * 1000 + 200);
    setTimeout(() => document.getElementById('center-line').classList.add('show'), data.analysis.length * 1000 + 700);
  }, 1800);
}

run();
</script>
</body>
</html>

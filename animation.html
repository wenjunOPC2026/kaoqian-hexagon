<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动画测试 - 出发的理由</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC","Noto Sans SC",sans-serif; background: #f0ebe0; display: flex; justify-content: center; padding: 40px 20px; }

  .card-outer { width: 100%; max-width: 560px; position: relative;
    border: 5px solid rgba(139,106,74,0.7); border-radius: 18px; padding: 10px; }
  .card-outer::after { content:''; position:absolute; inset:10px; border:2px solid rgba(160,144,128,0.5); border-radius:12px; pointer-events:none; }

  /* Corner ornaments */
  .corner { position:absolute; width:30px; height:30px; border-color:rgba(139,106,74,0.5); border-style:solid; z-index:2; }
  .corner.tl { top:6px; left:6px; border-width:2px 0 0 2px; border-radius:3px 0 0 0; }
  .corner.tr { top:6px; right:6px; border-width:2px 2px 0 0; border-radius:0 3px 0 0; }
  .corner.bl { bottom:6px; left:6px; border-width:0 0 2px 2px; border-radius:0 0 0 3px; }
  .corner.br { bottom:6px; right:6px; border-width:0 2px 2px 0; border-radius:0 0 3px 0; }

  .card { background: linear-gradient(180deg, #fdfaf5 0%, #faf5ed 50%, #f5ede0 100%); border-radius: 10px; padding: 40px 44px; }
  .accent-bar { height: 4px; background: #3a2a1a; border-radius: 2px; margin-bottom: 40px; }
  .title { text-align: center; font-size: 1.8em; font-weight: 300; color: #2c1a0a; margin-bottom: 36px; }

  .item { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 38px; opacity: 0; transform: translateY(12px); }
  .item.show { animation: fadeIn 0.45s ease-out forwards; }
  .item .dot { flex-shrink: 0; width: 14px; height: 14px; border-radius: 50%; margin-top: 6px; position:relative; }
  .item .dot::after { content:''; position:absolute; inset:-7px; border-radius:50%; }
  .item .dot .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; }
  /* halo colors per item */
  #item0 .dot::after { background:#f8d2cf; } #item1 .dot::after { background:#fce1c8; }
  #item2 .dot::after { background:#e6cdee; } #item3 .dot::after { background:#d2e6f8; }
  #item4 .dot::after { background:#d0f0e1; } #item5 .dot::after { background:#c8ebe4; }
  .item .label { font-size: 0.65em; color: #b0a090; margin-bottom: 4px; letter-spacing: 1px; }
  .item .text { font-weight: 300; font-size: 1.15em; color: #2c2416; line-height: 1.5; display: block; }

  .divider { height: 1px; background: #d8c8b0; margin: 38px 0 34px; opacity: 0; transform: scaleX(0); transform-origin: center; }
  .divider.show { animation: fadeIn 0.5s 0.15s ease-out forwards; }
  .center-line { text-align: center; font-size: 1.35em; font-weight: 300; color: #2c1a0a; line-height: 1.8; opacity: 0; transform: translateY(12px); }
  .center-line.show { animation: fadeIn 0.5s 0.3s ease-out forwards; }
  .brand { text-align: center; color: #b0a090; font-size: 0.75em; font-weight: 300; margin-top: 36px; }

  .loading { text-align: center; padding: 60px 0; }
  .loading-msg { font-size: 1.05em; color: #8b6a4a; font-weight: 300; animation: pulse 2s infinite; }
  .dot-row { margin-top: 8px; }
  .dot-row span { display: inline-block; margin: 0 4px; font-size: 1.5em; color: #c4a882; opacity: .2; }
  .dot-row span.on { opacity: 1; transition: opacity 0.3s; }

  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:.6;} 50%{opacity:1;} }

  .btn { display: block; margin: 30px auto 0; padding: 14px 48px; border: none; border-radius: 30px; background: #3a2a1a; color: #f5f0eb; font-size: 1.15em; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div style="width:100%;max-width:560px;">

  <div class="card-outer">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="card" id="card">
      <div class="accent-bar"></div>
      <div class="title" id="title">文君 出发的理由</div>
      <div class="loading" id="loading">
        <div class="loading-msg">AI 正在读你的答案</div>
        <div class="dot-row" id="dots"><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span></div>
      </div>
      <div id="content"></div>
    </div>
  </div>

  <button class="btn" onclick="run()">重新播放</button>

</div>

<script>
const data = {
  analysis: [
    "你真正想要的，是给自己发一张通行证。",
    "你怕被证明——当妈的确实不能两全。",
    "你在守住的，是给自己重新定义的权利。",
    "让你心跳的，是终于可以做回初学者。",
    "你获得的，是女儿心里种下了一颗种子。",
    "在这段关系里，你是她相信自己的证据。",
  ],
  center: "你想让女儿看到，妈妈也可以为自己活一次。",
  labels: ["深层动机","风险预警","内心防线","未来画面","意义锚点","共赢网络"],
  colors: ['#c0392b','#e67e22','#8e44ad','#2980b9','#27ae60','#16a085']
};

function run() {
  const content = document.getElementById('content');
  const loading = document.getElementById('loading');
  content.innerHTML = '';
  loading.style.display = 'block';

  const dotSpans = document.querySelectorAll('#dots span');
  let dotIdx = 0;
  dotSpans.forEach(s => s.className = '');
  const dotTimer = setInterval(() => {
    dotSpans.forEach((s, i) => s.className = (i <= dotIdx % 5) ? 'on' : '');
    dotIdx++;
  }, 300);

  setTimeout(() => {
    clearInterval(dotTimer);
    loading.style.display = 'none';

    let html = '';
    data.analysis.forEach((t, i) => {
      html +=
        '<div class="item" id="item' + i + '">' +
        '<span class="dot" style="background:' + data.colors[i] + '"><span class="num">' + (i+1) + '</span></span>' +
        '<div><span class="label">' + data.labels[i] + '</span>' +
        '<span class="text">' + t + '</span></div></div>';
    });
    html += '<div class="divider" id="divider"></div>';
    html += '<div class="center-line" id="center-line">' + data.center + '</div>';
    html += '<div class="brand">学姐爱丽丝 | 35岁脱产跨考 | 陪你做对的选择</div>';
    content.innerHTML = html;

    for (let i = 0; i < data.analysis.length; i++) {
      setTimeout(() => document.getElementById('item' + i).classList.add('show'), i * 1000);
    }
    setTimeout(() => document.getElementById('divider').classList.add('show'), data.analysis.length * 1000 + 200);
    setTimeout(() => document.getElementById('center-line').classList.add('show'), data.analysis.length * 1000 + 700);
  }, 1800);
}

run();
</script>
</body>
</html>

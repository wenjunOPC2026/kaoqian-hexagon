<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>出发的理由 - 演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "PingFang SC","Noto Sans SC",sans-serif; background: #f0ebe0; }

  /* ── Cover ── */
  .card-cover { position: fixed; inset: 0; z-index: 100; background: #3a2a1a;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1), opacity 0.5s; }
  .card-cover.hide { transform: translateY(-110%); opacity: 0; pointer-events: none; }

  .card-back { width: 80vw; max-width: 340px; height: 60vh; max-height: 480px; background: linear-gradient(145deg, #f5ede0, #e8d8c0);
    border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .card-back::before { content:''; position:absolute; inset:12px; border:2px solid #8b6a4a; border-radius:12px; opacity:.4; }
  .card-back::after { content:''; position:absolute; inset:20px; border:1px solid #a09080; border-radius:10px; opacity:.3; }
  .back-pattern { position:absolute; inset:30px; display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(7,1fr); opacity:.08; }
  .back-pattern span { border:1px solid #3a2a1a; }
  .corner { position:absolute; width:30px; height:30px; border-color:#8b6a4a; border-style:solid; opacity:.35; }
  .corner.tl { top:24px; left:24px; border-width:2px 0 0 2px; border-radius:4px 0 0 0; }
  .corner.tr { top:24px; right:24px; border-width:2px 2px 0 0; border-radius:0 4px 0 0; }
  .corner.bl { bottom:24px; left:24px; border-width:0 0 2px 2px; border-radius:0 0 0 4px; }
  .corner.br { bottom:24px; right:24px; border-width:0 2px 2px 0; border-radius:0 0 4px 0; }
  .back-center { position:relative; z-index:1; text-align:center; }
  .back-center .hex { font-size:3em; color:#8b6a4a; opacity:.6; margin-bottom:8px; }
  .back-center h2 { font-size:1.6em; color:#3a2a1a; font-weight:300; letter-spacing:6px; }
  .back-center .tap { font-size:.8em; color:#a09080; margin-top:24px; letter-spacing:2px; animation: pulse 2s infinite; }

  /* ── Form ── */
  .container { max-width: 560px; margin: 0 auto; padding: 5vw; height: 100vh; overflow-y: auto; display: none; }
  .container.show { display: block; }
  .form-header { text-align: center; padding: 4vw 0 3vw; }
  .form-header h1 { font-size: clamp(1.4em, 5vw, 2em); color:#3a2a1a; font-weight:300; letter-spacing:4px; }
  .form-header .sub { color:#8b7355; font-size: clamp(0.7em, 2.5vw, 0.9em); margin-top: 1vw; }

  .q-block { background: #fffaf5; border-radius: 10px; padding: 3vw 4vw; margin: 2vw 0; font-size: clamp(0.8em, 2.8vw, 1em); }
  .q-block.name-block { border-left: 3px solid #8b6a4a; }
  .q-block .q-title { font-weight: 600; margin-bottom: 2vw; }
  .q-block input { width: 100%; padding: 2vw 3vw; border: 2px dashed #c4a882; border-radius: 8px; background: #fdfaf5; font-size: inherit; font-family: inherit; color: #5c3d20; }

  .btn-wrap { text-align: center; margin: 5vw 0; }
  .btn { display: inline-block; padding: 3vw 10vw; border: none; border-radius: 30px; background: #3a2a1a; color: #f5f0eb; font-size: clamp(0.9em, 3vw, 1.1em); font-weight: 600; }

  /* ── Result Card ── */
  .result { display: none; position: fixed; inset:0; z-index:50; background:#f0ebe0; }
  .result.show { display: flex; align-items: center; justify-content: center; }
  .card-outer { width: 92vw; max-width: 520px; position: relative;
    border: 4px solid rgba(139,106,74,0.7); border-radius: 16px; padding: 8px; }
  .card-outer::after { content:''; position:absolute; inset:8px; border:2px solid rgba(160,144,128,0.5); border-radius:10px; pointer-events:none; }
  .card-outer .corner { opacity: .5; }
  .card-inner { background: linear-gradient(180deg, #fdfaf5 0%, #faf5ed 50%, #f5ede0 100%); border-radius: 10px; padding: 4vw 5vw; }
  .accent-bar { height: 3px; background: #3a2a1a; border-radius: 1.5px; margin-bottom: 5vw; }
  .card-title { text-align: center; font-size: clamp(1.2em, 5vw, 1.8em); font-weight: 300; color: #2c1a0a; margin-bottom: 5vw; }

  .item { display: flex; align-items: flex-start; gap: 2.5vw; margin-bottom: 4vw; opacity: 0; transform: translateY(12px); }
  .item.show { animation: fadeIn 0.45s ease-out forwards; }
  .item .dot { flex-shrink: 0; width: 6vw; height: 6vw; max-width: 28px; max-height: 28px; border-radius: 50%; margin-top: 1vw; display:flex; align-items:center; justify-content:center; }
  .item .num { width: 3.5vw; height: 3.5vw; max-width: 16px; max-height: 16px; border-radius: 50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size: clamp(7px, 2vw, 10px); font-weight:700; }
  .item .label { font-size: clamp(0.5em, 1.8vw, 0.65em); color: #b0a090; letter-spacing: 1px; margin-bottom: 0.5vw; }
  .item .text { font-weight: 300; font-size: clamp(0.85em, 3.2vw, 1.15em); color: #2c2416; line-height: 1.5; display: block; }

  .card-divider { height: 1px; background: #d8c8b0; margin: 5vw 0; opacity: 0; }
  .card-divider.show { animation: fadeIn 0.5s 0.15s ease-out forwards; }
  .center-line { text-align: center; font-size: clamp(1em, 3.5vw, 1.35em); font-weight: 300; color: #2c1a0a; line-height: 1.8; opacity: 0; transform: translateY(12px); }
  .center-line.show { animation: fadeIn 0.5s 0.3s ease-out forwards; }
  .brand-line { text-align: center; color: #b0a090; font-size: clamp(0.55em, 1.8vw, 0.75em); font-weight: 300; margin-top: 4vw; padding-bottom: 1vw; }

  .loading-msg { text-align: center; font-size: clamp(0.85em, 3vw, 1.05em); color: #8b6a4a; font-weight: 300; padding: 8vw 0 2vw; }
  .dot-row { text-align: center; padding-bottom: 6vw; }
  .dot-row span { display: inline-block; margin: 0 1vw; font-size: clamp(1em, 4vw, 1.5em); color: #c4a882; opacity: .2; }
  .dot-row span.on { opacity: 1; transition: opacity 0.3s; }

  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
  @keyframes typeBlink { 0%,100%{border-color:#8b6a4a;} 50%{border-color:transparent;} }
  .typing { border-right: 2px solid #8b6a4a; animation: typeBlink 0.6s infinite; }
</style>
</head>
<body>

<!-- ── Cover ── -->
<div class="card-cover" id="cover">
  <div class="card-back">
    <div class="back-pattern"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="back-center">
      <div class="hex">⬡</div>
      <h2>出发的理由</h2>
      <div class="tap">轻触翻开</div>
    </div>
  </div>
</div>

<!-- ── Form ── -->
<div class="container" id="form-page">
  <div class="form-header">
    <h1>出发的理由</h1>
    <p class="sub">回答六个问题，生成一张属于你的答案卡片</p>
  </div>
  <div class="q-block name-block"><div class="q-title">这张卡片属于谁？</div><input type="text" id="q-name" placeholder="写下你的名字" readonly></div>
  <div class="q-block"><div class="q-title">1. 你为什么要考研？</div><input type="text" id="q1" readonly></div>
  <div class="q-block"><div class="q-title">2. 如果你主动放弃了，最可能的原因是什么？</div><input type="text" id="q2" readonly></div>
  <div class="q-block"><div class="q-title">3. 有人说「都这个年纪了还瞎折腾」，你怎么回答？</div><input type="text" id="q3" readonly></div>
  <div class="q-block"><div class="q-title">4. 如果考上了，你的一天会是什么样子？</div><input type="text" id="q4" readonly></div>
  <div class="q-block"><div class="q-title">5. 如果没有考上，但坚持到了最后，你会怎样跟朋友讲起？</div><input type="text" id="q5" readonly></div>
  <div class="q-block"><div class="q-title">6. 有没有另外的人，会因为你的备考行动而变得更好？</div><input type="text" id="q6" readonly></div>
  <div class="btn-wrap"><span class="btn" id="gen-btn">✨ 生成我的答案卡片</span></div>
</div>

<!-- ── Result ── -->
<div class="result" id="result-page">
  <div class="card-outer">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="card-inner">
      <div class="accent-bar"></div>
      <div class="card-title">文君 出发的理由</div>
      <div class="loading-msg" id="loading-msg">AI 正在读你的答案</div>
      <div class="dot-row" id="dots"><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span></div>
      <div id="card-content"></div>
    </div>
  </div>
</div>

<script>
const answers = [
  "想证明35岁还能重新开始",
  "孩子生病我要花时间照顾，来不及准备",
  "这是我的人生，跟年龄无关",
  "阳光从窗户照进来，能闻到旧书的味道",
  "至少我勇敢过，女儿看到了妈妈没放弃",
  "女儿会因为看到妈妈努力，而更相信自己"
];
const name = "文君";
const colors = ['#c0392b','#e67e22','#8e44ad','#2980b9','#27ae60','#16a085'];
const halos = ['#f8d2cf','#fce1c8','#e6cdee','#d2e6f8','#d0f0e1','#c8ebe4'];
const labels = ['深层动机','风险预警','内心防线','未来画面','意义锚点','共赢网络'];
const analysis = [
  "你真正想要的，是给自己发一张通行证。",
  "你怕被证明——当妈的确实不能两全。",
  "你在守住的，是给自己重新定义的权利。",
  "让你心跳的，是终于可以做回初学者。",
  "你获得的，是女儿心里种下了一颗种子。",
  "在这段关系里，你是她相信自己的证据。"
];
const centerText = "你想让女儿看到，妈妈也可以为自己活一次。";

// ── SEQUENCE ──
async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeInto(el, text, speed) {
  el.classList.add('typing');
  for (let i = 0; i < text.length; i++) {
    el.value = text.substring(0, i+1);
    await sleep(speed || 60);
  }
  el.classList.remove('typing');
}

async function run() {
  // 1. Show cover for 2s, then flip
  await sleep(2000);
  document.getElementById('cover').classList.add('hide');
  document.getElementById('form-page').classList.add('show');
  await sleep(800);

  // 2. Type name
  await typeInto(document.getElementById('q-name'), name, 100);
  await sleep(400);

  // 3. Type each answer
  for (let i = 1; i <= 6; i++) {
    document.getElementById('q' + i).scrollIntoView({ behavior: 'smooth', block: 'center' });
    await sleep(300);
    await typeInto(document.getElementById('q' + i), answers[i-1], 50);
    await sleep(200);
  }

  // 4. Scroll to button, tap
  document.getElementById('gen-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
  await sleep(500);
  document.getElementById('gen-btn').style.opacity = '0.6';
  await sleep(300);
  document.getElementById('gen-btn').style.opacity = '1';

  // 5. Show result page with loading
  await sleep(400);
  document.getElementById('form-page').style.display = 'none';
  document.getElementById('result-page').classList.add('show');

  // Loading animation
  const dotSpans = document.querySelectorAll('#dots span');
  let dotIdx = 0;
  const dotTimer = setInterval(() => {
    dotSpans.forEach((s, i) => s.className = (i <= dotIdx % 5) ? 'on' : '');
    dotIdx++;
  }, 300);
  await sleep(2500);
  clearInterval(dotTimer);

  // 6. Replace loading with analysis
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('dots').style.display = 'none';

  const content = document.getElementById('card-content');
  let html = '';
  analysis.forEach((t, i) => {
    html +=
      '<div class="item" id="ri' + i + '">' +
      '<span class="dot" style="background:' + halos[i] + '"><span class="num" style="background:' + colors[i] + '">' + (i+1) + '</span></span>' +
      '<div><span class="label">' + labels[i] + '</span>' +
      '<span class="text">' + t + '</span></div></div>';
  });
  html += '<div class="card-divider" id="rdivider"></div>';
  html += '<div class="center-line" id="rcenter">' + centerText + '</div>';
  html += '<div class="brand-line">学姐爱丽丝 | 35岁脱产跨考 | 陪你做对的选择</div>';
  content.innerHTML = html;

  // Sequential reveal
  for (let i = 0; i < 6; i++) {
    document.getElementById('ri' + i).classList.add('show');
    await sleep(1000);
  }
  await sleep(200);
  document.getElementById('rdivider').classList.add('show');
  await sleep(500);
  document.getElementById('rcenter').classList.add('show');
  await sleep(3000);
}

run();
</script>
</body>
</html>
